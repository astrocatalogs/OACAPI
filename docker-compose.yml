version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OAC_BACKEND: ${OAC_BACKEND:-sqlite}
      OAC_DB_PATH: ${OAC_DB_PATH:-/data/oacapi.db}
      PYTHONUNBUFFERED: "1"
    command: gunicorn --bind 0.0.0.0:5000 --workers ${API_WORKERS:-1} --threads ${API_THREADS:-2} wsgi:app
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - oacapi-data:/data
      - ${AC_PATH:-./astrocats}:/root/astrocats/astrocats:ro
    healthcheck:
      test: ["CMD", "python", "-c", "from api import app; print('ok')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 640m
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    environment:
      OAC_BACKEND: ${OAC_BACKEND:-sqlite}
      OAC_DB_PATH: ${OAC_DB_PATH:-/data/oacapi.db}
      PYTHONUNBUFFERED: "1"
    command: python mcp_server.py
    volumes:
      - oacapi-data:/data
      - ${AC_PATH:-./astrocats}:/root/astrocats/astrocats:ro
    depends_on:
      - api
    mem_limit: 256m
    restart: unless-stopped

  ingest:
    build:
      context: .
      dockerfile: Dockerfile.ingest
    profiles: ["ingest"]
    environment:
      OAC_DB_PATH: ${OAC_DB_PATH:-/data/oacapi.db}
      AC_PATH: ${INGEST_AC_PATH:-/root/astrocats/astrocats}
      PYTHONUNBUFFERED: "1"
    command: python scripts/ingest_static_catalogs.py
    volumes:
      - oacapi-data:/data
      - ${AC_PATH:-./astrocats}:/root/astrocats/astrocats:ro
    mem_limit: 768m

volumes:
  oacapi-data:
